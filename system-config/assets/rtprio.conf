# Grant realtime scheduling priority to the video group, which the app user is a member of.
@video - rtprio 99

# Grant realtime scheduling priority to the root user. This is required for correct
# Nsight Systems profiling of the app; it launches the profiler as root, then drops
# privileges to the app user. Without also granting rtprio to root, the privilege drop
# will inherit the default-zero rtprio limit, and the SCHED_FIFO thread setting will fail.
root - rtprio 99

